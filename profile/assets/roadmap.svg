<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NexVora roadmap from launch through Q3 2026, with model rollouts per milestone.">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#13133b"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#bg3)"/>

  <text x="600" y="44" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">
    The road from launch
  </text>
  <text x="600" y="74" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">
    Day one in May. Web chat in June. IDE plugin in Q3. New models every milestone.
  </text>

  <line x1="120" y1="270" x2="1080" y2="270" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(200, 270)">
    <circle r="16" fill="#22d3ee">
      <animate attributeName="r" values="16;20;16" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="7" fill="#0a0e27"/>
    <line x1="0" y1="-16" x2="0" y2="-60" stroke="#22d3ee" stroke-width="2"/>
    <rect x="-115" y="-190" width="230" height="130" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="0" y="-160" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#22d3ee" text-anchor="middle" letter-spacing="2">DAY ONE</text>
    <text x="0" y="-135" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">25 May 2026</text>
    <text x="0" y="-112" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">MCP server + CLI</text>
    <text x="0" y="-96" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">PATs / Device Grant / E2E tunnel</text>
    <text x="0" y="-76" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">Claude 4.7 / GPT-4o / Gemini 2.5</text>
    <line x1="0" y1="16" x2="0" y2="40" stroke="#22d3ee" stroke-width="2"/>
    <text x="0" y="60" font-family="JetBrains Mono, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">v1.0</text>
  </g>

  <g transform="translate(600, 270)">
    <circle r="14" fill="#a78bfa"/>
    <circle r="6" fill="#0a0e27"/>
    <line x1="0" y1="14" x2="0" y2="50" stroke="#a78bfa" stroke-width="2"/>
    <rect x="-115" y="50" width="230" height="130" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="0" y="80" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="2">+ 4 WEEKS</text>
    <text x="0" y="105" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Web Chat UI</text>
    <text x="0" y="128" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">app.nexvora.io/chat</text>
    <text x="0" y="144" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">+ ContextBundle v2 multi-host</text>
    <text x="0" y="164" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">+ DeepSeek / Llama 3.3 / Mistral</text>
  </g>

  <g transform="translate(1000, 270)">
    <circle r="14" fill="#f0abfc"/>
    <circle r="6" fill="#0a0e27"/>
    <line x1="0" y1="-14" x2="0" y2="-60" stroke="#f0abfc" stroke-width="2"/>
    <rect x="-115" y="-190" width="230" height="130" rx="12" fill="#1e293b" stroke="#f0abfc" stroke-width="2"/>
    <text x="0" y="-160" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f0abfc" text-anchor="middle" letter-spacing="2">Q3 2026</text>
    <text x="0" y="-135" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">IDE Plugin v1</text>
    <text x="0" y="-112" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">IntelliJ first / VS Code next</text>
    <text x="0" y="-96" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Right-click code actions</text>
    <text x="0" y="-76" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#f0abfc" text-anchor="middle">+ next-gen Claude/GPT/Gemini</text>
  </g>
</svg>
