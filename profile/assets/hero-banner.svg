<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NexVora — AI capacity, donor-powered. Launching 25 May 2026.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#13133b"/>
      <stop offset="100%" stop-color="#1e0a3c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <circle cx="950" cy="180" r="280" fill="url(#glow)"/>

  <g transform="translate(70, 90)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-3">
      Nex<tspan fill="url(#accent)">Vora</tspan>
    </text>

    <text x="0" y="56" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#cbd5e1" letter-spacing="0.5">
      Donor-powered AI capacity. Skip the subscription.
    </text>

    <text x="0" y="92" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" fill="#94a3b8" letter-spacing="2">
      ROUTE CLAUDE THROUGH ANY MCP-CAPABLE HOST. PAY IN COINS.
    </text>

    <g transform="translate(0, 130)">
      <rect width="320" height="56" rx="28" fill="url(#accent)"/>
      <circle cx="40" cy="28" r="10" fill="#0a0e27"/>
      <circle cx="40" cy="28" r="6" fill="#ffffff">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="65" y="35" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0a0e27">
        Launching 25 May 2026
      </text>
    </g>

    <g transform="translate(340, 130)">
      <rect width="170" height="56" rx="28" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <text x="85" y="35" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#22d3ee" text-anchor="middle">
        Closed beta open
      </text>
    </g>
  </g>

  <g transform="translate(820, 60)" opacity="0.92">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="100" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="50" y="30" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">your IDE</text>
      <text x="50" y="44" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Copilot free</text>
    </g>

    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="100" height="60" rx="10" fill="#1e293b" stroke="url(#accent)" stroke-width="2"/>
      <text x="50" y="30" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle">NexVora</text>
      <text x="50" y="44" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">relay</text>
    </g>

    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="100" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="50" y="30" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">donor</text>
      <text x="50" y="44" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Claude Pro</text>
    </g>

    <g stroke="url(#cyan)" stroke-width="2" fill="none">
      <path d="M 100 30 L 150 30">
        <animate attributeName="stroke-dasharray" values="0 50;50 0" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M 250 30 L 300 30">
        <animate attributeName="stroke-dasharray" values="0 50;50 0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      </path>
      <polygon points="148,26 148,34 154,30" fill="#22d3ee"/>
      <polygon points="298,26 298,34 304,30" fill="#22d3ee"/>
    </g>

    <g transform="translate(150, 80)">
      <rect x="0" y="0" width="100" height="36" rx="18" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="50" y="22" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#22d3ee" text-anchor="middle">E2E encrypted</text>
    </g>

    <g transform="translate(0, 150)" font-family="JetBrains Mono, Menlo, monospace" font-size="11" fill="#64748b">
      <text x="0" y="0">$ ANTHROPIC_BILL=0</text>
      <text x="0" y="18" fill="#a78bfa">$ COINS_PAID=tiny</text>
      <text x="0" y="36">$ WORK_DONE=yes</text>
    </g>
  </g>

  <g transform="translate(0, 330)" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">
    <text x="70" y="0" letter-spacing="3">claude code  ·  cursor  ·  copilot  ·  cline  ·  continue  ·  chatgpt desktop  ·  zed  ·  intellij*  ·  vscode*</text>
  </g>
</svg>
